<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriveOrder 매장</title>
<!--
  DriveOrder 가상 매장 주문 접수 화면.
  - Firestore "orders"를 3초마다 읽어, 전송 시각(sendAt)이 지난 주문만 보여 줍니다.
    → 차량 앱이 꺼져 있어도 정해진 시각이 되면 매장에 주문이 뜹니다.
  - 버튼은 status 필드만 부분 갱신합니다 (앱이 고치는 etaAt·sendAt은 건드리지 않음).
  - 브라우저에서 이 파일을 그대로 열면 됩니다. 서버 불필요.
  ⚠️ Firestore 테스트 모드(인증 없음) 전제. 제출 전 보안 규칙을 잠가야 합니다.
-->
<style>
  :root { --bg:#f5f5f4; --card:#fff; --text:#1c1917; --muted:#78716c; --line:#e7e5e4;
          --accent:#2563eb; --ok:#16a34a; --warn:#d97706; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1917; --card:#292524; --text:#f5f5f4; --muted:#a8a29e; --line:#44403c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:16px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:20px; }
  header .clock { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
  select { font:inherit; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  main { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px; padding:16px; }
  section h2 { font-size:15px; color:var(--muted); margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .card .menu { font-size:18px; font-weight:600; }
  .card .meta { color:var(--muted); font-size:14px; }
  .card .eta { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; margin:6px 0; }
  .card .delay { color:var(--warn); font-weight:600; font-size:14px; }
  .card.late .eta { color:var(--warn); }
  button { font:inherit; font-weight:600; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; color:#fff; background:var(--accent); }
  button.ok { background:var(--ok); }
  .upcoming .card { opacity:.6; }
  .empty { color:var(--muted); font-size:14px; }
  #err { color:#dc2626; padding:0 16px; }
</style>
</head>
<body>
<header>
  <h1>🍳 DriveOrder 매장</h1>
  <select id="store"><option value="">전체 매장</option></select>
  <span class="clock" id="clock"></span>
</header>
<div id="err"></div>
<main>
  <section><h2>접수 대기 (지금 조리 시작)</h2><div id="col-new"></div></section>
  <section><h2>조리 중</h2><div id="col-cooking"></div></section>
  <section><h2>조리 완료 · 픽업 대기</h2><div id="col-ready"></div></section>
  <section class="upcoming"><h2>예약됨 (전송 전 · 참고용)</h2><div id="col-upcoming"></div></section>
</main>
<script>
const PROJECT_ID = "project-free-9191b";
const BASE = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;
const POLL_MS = 3000;

const firstEta = {};   // 처음 본 도착 예정 시각 → 지연 계산용
let orders = [];

// ---------- Firestore 형식 ↔ 일반 값 ----------
function fromValue(v) {
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("mapValue" in v) return fromFields(v.mapValue.fields || {});
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(fromValue);
  return null;
}
function fromFields(f) { const o = {}; for (const k in f) o[k] = fromValue(f[k]); return o; }

async function listAll(collection) {
  const out = []; let token = "";
  do {
    const r = await fetch(`${BASE}/${collection}?pageSize=300${token ? "&pageToken=" + token : ""}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    (j.documents || []).forEach(d => out.push(fromFields(d.fields || {})));
    token = j.nextPageToken || "";
  } while (token);
  return out;
}

async function setStatus(id, status) {
  const r = await fetch(`${BASE}/orders/${id}?updateMask.fieldPaths=status`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fields: { status: { stringValue: status } } })
  });
  if (!r.ok) { showErr(`상태 변경 실패: HTTP ${r.status}`); return; }
  const o = orders.find(o => o.id === id); if (o) o.status = status;
  render();
}

// ---------- 화면 ----------
const fmtMin = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}분 ${s % 60}초`; };
const won = n => Number(n).toLocaleString("ko-KR") + "원";
function showErr(msg) { document.getElementById("err").textContent = msg; }

function card(o, now) {
  const el = document.createElement("div");
  el.className = "card";
  const untilEta = o.etaAt - now;
  const delay = o.etaAt - (firstEta[o.id] ?? o.etaAt);
  if (o.status === "cooking" && untilEta < 0) el.classList.add("late");
  el.innerHTML = `
    <div class="menu"></div>
    <div class="meta"></div>
    <div class="eta"></div>
    ${Math.abs(delay) >= 60000 ? `<div class="delay">⏱ 도착 ${delay > 0 ? fmtMin(delay) + " 지연" : fmtMin(-delay) + " 빨라짐"}</div>` : ""}
  `;
  el.dataset.id = o.id;
  el.querySelector(".menu").textContent = `${o.menuName} · ${won(o.price)}`;
  el.querySelector(".meta").textContent = `${o.storeName} · 조리 ${o.cookMin}분 · ${o.id}`;
  el.querySelector(".eta").textContent = etaText(o, now);

  const btn = (label, next, cls) => {
    const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls;
    b.onclick = () => setStatus(o.id, next); el.appendChild(b);
  };
  if (o.status === "scheduled" || o.status === "sent") {
    if (o.sendAt <= now) btn("조리 시작", "cooking");
  } else if (o.status === "cooking") btn("조리 완료", "ready", "ok");
  else if (o.status === "ready") btn("픽업 완료", "picked_up", "ok");
  return el;
}

function etaText(o, now) {
  if ((o.status === "scheduled" || o.status === "sent") && o.sendAt > now) return `${fmtMin(o.sendAt - now)} 뒤 접수`;
  const untilEta = o.etaAt - now;
  return untilEta > 0 ? `고객 도착 ${fmtMin(untilEta)} 전` : "고객 도착!";
}

let lastSig = "";

function render() {
  const now = Date.now();
  document.getElementById("clock").textContent = new Date(now).toLocaleTimeString("ko-KR");
  const storeId = document.getElementById("store").value;
  const cols = { new: [], cooking: [], ready: [], upcoming: [] };
  orders
    .filter(o => !storeId || o.storeId === storeId)
    .filter(o => o.status !== "picked_up")
    .sort((a, b) => a.etaAt - b.etaAt)
    .forEach(o => {
      if (o.status === "cooking") cols.cooking.push(o);
      else if (o.status === "ready") cols.ready.push(o);
      else if (o.sendAt <= now) cols.new.push(o);   // 전송 시각이 지난 주문만 매장에 표시
      else cols.upcoming.push(o);
    });
  // 주문 구성이 바뀔 때만 카드를 다시 그림 → 누르는 도중 버튼이 교체되지 않게
  const sig = JSON.stringify(Object.entries(cols).map(([k, list]) =>
    [k, list.map(o => [o.id, o.status, o.etaAt, o.etaAt < now])]));
  if (sig !== lastSig) {
    lastSig = sig;
    for (const k in cols) {
      const box = document.getElementById("col-" + k);
      box.replaceChildren(...cols[k].map(o => card(o, now)));
      if (!cols[k].length) box.innerHTML = `<div class="empty">없음</div>`;
    }
  }
  // 남은 시간 글자만 매초 갱신
  document.querySelectorAll(".card").forEach(el => {
    const o = orders.find(o => o.id === el.dataset.id);
    if (o) el.querySelector(".eta").textContent = etaText(o, now);
  });
}

async function poll() {
  try {
    // 필수 필드가 없는 깨진 문서는 무시
    orders = (await listAll("orders")).filter(o => o.id && o.menuName && o.status && o.etaAt && o.sendAt);
    // 지연은 매장에 주문이 보이기 시작한 시점(sendAt 이후)의 도착 예정 기준으로 계산
    const now = Date.now();
    orders.forEach(o => { if (!(o.id in firstEta) && o.sendAt <= now) firstEta[o.id] = o.etaAt; });
    showErr("");
  } catch (e) { showErr("주문 불러오기 실패: " + e.message); }
  render();
}

async function loadStores() {
  try {
    const stores = await listAll("stores");
    const sel = document.getElementById("store");
    stores.forEach(s => { const op = document.createElement("option"); op.value = s.id; op.textContent = s.name; sel.appendChild(op); });
  } catch (e) { showErr("매장 목록 실패: " + e.message); }
}

document.getElementById("store").onchange = render;
loadStores();
poll();
setInterval(poll, POLL_MS);
setInterval(render, 1000);   // 남은 시간 표시를 1초마다 갱신
</script>
</body>
</html>
